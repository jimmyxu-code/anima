<!DOCTYPE html><html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小凯远程入口</title>
<style>body{background:#17171c;color:#e8e8ec;font:16px/1.6 system-ui,
sans-serif;display:flex;align-items:center;justify-content:center;
height:100vh;margin:0}div{text-align:center}a{color:#40e0d0}</style></head>
<body><div id="m">正在接通小凯远程…</div>
<script>
fetch('current.txt',{cache:'no-store'})
 .then(r=>r.text())
 .then(u=>{u=u.trim();
   if(u&&u.startsWith('https://')){location.replace(u)}
   else{document.getElementById('m').innerHTML=
     '入口数据为空，稍后再试<br><a href="./">重试</a>'}})
 .catch(()=>{document.getElementById('m').innerHTML=
   '取入口失败（网络）<br><a href="./">重试</a>'});
</script></body></html>
